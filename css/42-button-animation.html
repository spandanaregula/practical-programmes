<!doctype html><html><head><title>Button Hover Animation</title><style>button{padding:1rem 2rem;border:0;background:#264653;color:white;position:relative;overflow:hidden}button::after{content:'';position:absolute;inset:0;background:#e76f51;transform:translateX(-100%);transition:transform .3s}button:hover::after{transform:translateX(0)}button span{position:relative;z-index:1}</style></head><body><button><span>Hover Button</span></button></body></html>
