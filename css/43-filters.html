<!doctype html><html><head><title>CSS Filters</title><style>.gallery{display:flex;gap:1rem;flex-wrap:wrap}.gallery img{width:180px}.blur{filter:blur(3px)}.gray{filter:grayscale(1)}.bright{filter:brightness(1.6)}.contrast{filter:contrast(1.8)}</style></head><body><div class="gallery"><img src="https://picsum.photos/180/120?1" class="blur" alt="Blur"><img src="https://picsum.photos/180/120?2" class="gray" alt="Grayscale"><img src="https://picsum.photos/180/120?3" class="bright" alt="Brightness"><img src="https://picsum.photos/180/120?4" class="contrast" alt="Contrast"></div></body></html>
