<!doctype html><html><head><title>Grid Template Areas</title><style>.page{display:grid;grid-template-areas:'header header' 'nav main' 'footer footer';grid-template-columns:180px 1fr;min-height:100vh}.header{grid-area:header;background:#264653;color:white;padding:1rem}.nav{grid-area:nav;background:#e9c46a;padding:1rem}.main{grid-area:main;padding:2rem}.footer{grid-area:footer;background:#2a9d8f;color:white;padding:1rem}@media(max-width:600px){.page{grid-template-areas:'header' 'nav' 'main' 'footer';grid-template-columns:1fr}}</style></head><body><div class="page"><header class="header">Header</header><nav class="nav">Nav</nav><main class="main">Main</main><footer class="footer">Footer</footer></div></body></html>
