<!doctype html><html><head><title>CSS Transitions</title><style>.card{width:180px;padding:2rem;background:#e9c46a;transition:all .5s ease}.card:hover{background:#264653;color:white;transform:translateY(-10px);box-shadow:0 10px 20px #aaa}</style></head><body><div class="card">Hover to transition</div></body></html>
