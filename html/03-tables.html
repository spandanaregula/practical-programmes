<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML Tables</title></head>
<body>
  <h1>Product Table</h1>
  <table border="1" cellpadding="8">
    <caption>Office Supplies</caption>
    <thead><tr><th colspan="3">Product Details</th></tr><tr><th>Product</th><th>Category</th><th>Price</th></tr></thead>
    <tbody><tr><td>Notebook</td><td rowspan="2">Stationery</td><td>$5</td></tr><tr><td>Pen Set</td><td>$3</td></tr><tr><td colspan="2">Total</td><td>$8</td></tr></tbody>
  </table>
</body>
</html>
