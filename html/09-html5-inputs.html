<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML5 Input Types</title></head>
<body>
  <h1>HTML5 Form Inputs</h1>
  <form action="#" method="post">
    <label for="email">Email: <input id="email" name="email" type="email" placeholder="name@example.com" required></label><br><br>
    <label for="date">Birth date: <input id="date" name="date" type="date"></label><br><br>
    <label for="number">Credits: <input id="number" name="number" type="number" min="1" max="30" value="6"></label><br><br>
    <label for="password">Password: <input id="password" name="password" type="password" minlength="8" required></label><br><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
