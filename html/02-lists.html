<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML Lists</title></head>
<body>
  <h1>Types of HTML Lists</h1>
  <h2>Ordered List</h2>
  <ol><li>Plan</li><li>Design</li><li>Develop</li></ol>
  <h2>Unordered List</h2>
  <ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
  <h2>Description List</h2>
  <dl><dt>HTML</dt><dd>The structure of a webpage.</dd><dt>CSS</dt><dd>The presentation of a webpage.</dd></dl>
</body>
</html>
