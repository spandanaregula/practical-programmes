<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Selectors</title><style>
* { box-sizing: border-box; } body { font-family: Georgia, serif; color: #243447; margin: 0; padding: 2rem; background: #eef4f7; } h1 { color: #0b7285; } .note { background: #fff3bf; margin: 1rem 0; padding: 1rem; border: 2px solid #f08c46; } #special { font-size: 1.2rem; border-left: 6px solid #0b7285; } a:hover { color: #d9480f; }
</style></head>
<body><h1>CSS Selector Demonstration</h1><p class="note">This element uses a class selector, color, margin, padding, and border.</p><p id="special">This element uses an ID selector and custom font sizing.</p><a href="#special">Hover over this link</a></body>
</html>
