<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Registration</title></head>
<body>
  <h1>Student Registration Form</h1>
  <form action="#" method="post">
    <label for="name">Full name:</label><input id="name" name="name" type="text" required><br><br>
    <label for="email">Email:</label><input id="email" name="email" type="email" required><br><br>
    <label for="course">Course:</label><select id="course" name="course"><option>Computer Science</option><option>Business</option><option>Design</option></select><br><br>
    <fieldset><legend>Study mode</legend><label><input type="radio" name="mode" value="online" checked> Online</label><label><input type="radio" name="mode" value="campus"> Campus</label></fieldset><br>
    <label><input type="checkbox" name="terms" required> I accept the terms.</label><br><br>
    <label for="message">Message:</label><textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>
    <button type="submit">Register</button><button type="reset">Clear</button>
  </form>
</body>
</html>
